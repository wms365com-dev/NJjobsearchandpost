<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NJ Job Auto Poster</title><style>
body{font-family:Arial,sans-serif;background:#f5f5f7;margin:0;color:#222}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;gap:12px;flex-wrap:wrap;align-items:center}input,select,button,textarea{padding:10px;border:1px solid #ccc;border-radius:10px}button{background:#111;color:#fff;cursor:pointer}button.light{background:#fff;color:#111}.card{background:white;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.muted{color:#666;font-size:13px}.pill{display:inline-block;background:#eee;border-radius:20px;padding:4px 10px;font-size:12px}textarea{width:100%;height:190px}.title{font-weight:700;font-size:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}.top>*{width:100%}}
</style></head><body><div class="wrap"><h1>NJ Job Auto Poster</h1><p class="muted">Collect New Jersey job leads, review them, copy clean Facebook posts, then mark them posted. This avoids risky Facebook bot posting.</p><div class="top"><input id="pass" type="password" placeholder="Admin password"><select id="status"><option>new</option><option>posted</option><option>skip</option></select><button onclick="loadJobs()">Load Jobs</button><button onclick="fetchJobs()">Fetch New Jobs</button><button class="light" onclick="exportCsv()">Export CSV</button></div><div id="msg" class="muted"></div><div id="jobs"></div></div><script>
const $=id=>document.getElementById(id);const headers=()=>({'Content-Type':'application/json','x-admin-password':$('pass').value});
async function fetchJobs(){ $('msg').textContent='Fetching...'; const r=await fetch('/api/fetch',{method:'POST',headers:headers()}); $('msg').textContent=JSON.stringify(await r.json()); loadJobs(); }
async function loadJobs(){ const r=await fetch('/api/jobs?status='+encodeURIComponent($('status').value),{headers:headers()}); if(!r.ok){$('msg').textContent='Check password.';return} const jobs=await r.json(); $('msg').textContent=`Loaded ${jobs.length} jobs`; $('jobs').innerHTML=jobs.map(j=>`<div class="card"><div class="grid"><div><div class="title">${esc(j.title)}</div><p>${esc(j.company)}<br>${esc(j.location)}<br><span class="pill">${esc(j.category)}</span> <span class="pill">${esc(j.source)}</span></p><p class="muted">${esc((j.description||'').slice(0,220))}</p><p><a href="${j.url}" target="_blank">Open job link</a></p><button onclick="mark(${j.id},'posted')">Mark Posted</button> <button class="light" onclick="mark(${j.id},'skip')">Skip</button></div><div><textarea id="post${j.id}">${esc(j.post_text)}</textarea><br><button onclick="copyPost(${j.id})">Copy Facebook Post</button> <button class="light" onclick="savePost(${j.id})">Save Edit</button></div></div></div>`).join(''); }
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
async function mark(id,status){ await fetch(`/api/jobs/${id}/status`,{method:'POST',headers:headers(),body:JSON.stringify({status})}); loadJobs(); }
async function savePost(id){ await fetch(`/api/jobs/${id}/post`,{method:'POST',headers:headers(),body:JSON.stringify({post_text:$('post'+id).value})}); $('msg').textContent='Saved.'; }
async function copyPost(id){ await navigator.clipboard.writeText($('post'+id).value); $('msg').textContent='Copied. Paste into Facebook group or Meta Business Suite.'; }
function exportCsv(){ location.href='/api/export.csv?password='+encodeURIComponent($('pass').value); }
loadJobs();
</script></body></html>
