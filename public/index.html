<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NJ Job Auto Poster</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f5f7;margin:0;color:#222}
    .wrap{max-width:1180px;margin:auto;padding:22px}
    .top,.links{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    input,select,button,textarea{padding:10px;border:1px solid #ccc;border-radius:8px}
    button,.linkbtn{background:#111;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
    button.light,.linkbtn.light{background:#fff;color:#111}
    .card{background:white;border-radius:8px;padding:16px;margin:14px 0;box-shadow:0 3px 16px #0001}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .muted{color:#666;font-size:13px}
    .pill{display:inline-block;background:#eee;border-radius:20px;padding:4px 10px;font-size:12px}
    textarea{width:100%;height:190px;box-sizing:border-box}
    .title{font-weight:700;font-size:18px}
    @media(max-width:800px){.grid{grid-template-columns:1fr}.top>*,.links>*{width:100%;box-sizing:border-box}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="appTitle">NJ Job Auto Poster</h1>
    <p class="muted">Collect New Jersey job leads, review them, copy clean Facebook posts, then mark them posted.</p>

    <div class="card">
      <div class="title">Indeed NJ Searches</div>
      <p class="muted">Open Indeed searches, verify the listing, then paste the apply link into a Facebook post.</p>
      <div class="links" id="indeedLinks"></div>
    </div>

    <div class="top">
      <select id="profile" onchange="changeProfile()"></select>
      <select id="status"><option>all</option><option>new</option><option>posted</option><option>skip</option></select>
      <button onclick="loadJobs()">View Saved Jobs</button>
      <button onclick="fetchJobs()">Fetch New Jobs</button>
      <button class="light" onclick="exportCsv()">Export CSV</button>
      <button class="light" onclick="openFacebookGroup()">Open Facebook Group</button>
      <button class="light" onclick="autoPostToFacebookPage()">Auto Post to Page</button>
    </div>
    <div id="sourceStatus" class="card muted"></div>
    <div id="msg" class="muted"></div>
    <div id="jobs"></div>
  </div>

  <script>
    const $=id=>document.getElementById(id);
    let locationProfiles=[];
    const indeedSearches=[
      ['Warehouse','warehouse'],
      ['Customer Service','customer service'],
      ['Data Entry','data entry'],
      ['Office Admin','office admin'],
      ['Clerical','clerical'],
      ['Call Center','call center'],
      ['Retail','retail'],
      ['Security','security'],
      ['No Experience','no experience']
    ];
    $('indeedLinks').innerHTML=indeedSearches.map(([label,q])=>{
      const url='https://www.indeed.com/jobs?q='+encodeURIComponent(q)+'&l='+encodeURIComponent('New Jersey')+'&sort=date';
      return `<a class="linkbtn light" href="${url}" target="_blank" rel="noopener">${esc(label)}</a>`;
    }).join('');

    async function fetchJobs(){
      $('msg').textContent='Fetching...';
      const r=await fetch('/api/fetch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile:$('profile').value})});
      $('msg').textContent=JSON.stringify(await r.json());
      loadSourceStatus();
      loadJobs();
    }
    async function loadSourceStatus(){
      const [configRes, countsRes]=await Promise.all([fetch('/api/config'),fetch('/api/source-counts?profile='+encodeURIComponent($('profile').value||'nj'))]);
      const config=configRes.ok?await configRes.json():{};
      if(config.locationProfiles && !locationProfiles.length){
        locationProfiles=config.locationProfiles;
        $('profile').innerHTML=locationProfiles.map(p=>`<option value="${esc(p.id)}">${esc(p.label)}</option>`).join('');
        const profile=locationProfiles.find(p=>p.id===$('profile').value);
        if(profile) $('appTitle').textContent=profile.label;
      }
      const counts=countsRes.ok?await countsRes.json():[];
      const sourceCounts=counts.length?counts.map(row=>`${esc(row.source)}: ${row.count}`).join(' | '):'No saved jobs yet';
      const activeProfile=locationProfiles.find(p=>p.id===$('profile').value);
      $('sourceStatus').innerHTML=`<strong>Sources for ${esc(activeProfile?.location||'selected location')}</strong><br>Jooble: ${config.joobleConfigured?'configured':'missing key'} | Adzuna: ${config.adzunaConfigured?'configured':'missing keys'} | USAJOBS: ${config.usajobsConfigured?'configured':'missing keys'} | Facebook Page: ${config.facebookPageConfigured?'configured':'not configured'}<br>Saved jobs by source: ${sourceCounts}<br>RSS feeds: ${(config.defaultRssFeeds||[]).length+(config.extraRssFeeds||[]).length}`;
    }
    async function loadJobs(){
      const r=await fetch('/api/jobs?status='+encodeURIComponent($('status').value)+'&profile='+encodeURIComponent($('profile').value||'nj'));
      if(!r.ok){$('msg').textContent='Unable to load jobs.';return}
      const jobs=await r.json();
      $('msg').textContent=`Loaded ${jobs.length} saved jobs. Fetch only adds new non-duplicate jobs.`;
      $('jobs').innerHTML=jobs.map(j=>`<div class="card"><div class="grid"><div><div class="title">${esc(j.title)}</div><p>${esc(j.company)}<br>${esc(j.location)}<br><span class="pill">${esc(j.category)}</span> <span class="pill">${esc(j.source)}</span> <span class="pill">${esc(j.age_label||'Age unknown')}</span>${j.facebook_posted_at?` <span class="pill">Page posted</span>`:''}</p><p class="muted">Saved: ${esc(formatDate(j.created_at))}${j.date_posted?` | Job posted: ${esc(formatDate(j.date_posted))}`:''}</p><p class="muted">${esc((j.description||'').slice(0,220))}</p>${j.facebook_post_error?`<p class="muted">Facebook error: ${esc(j.facebook_post_error)}</p>`:''}<p><a href="${j.url}" target="_blank" rel="noopener">Open job link</a></p><button onclick="mark(${j.id},'posted')">Mark Posted</button> <button class="light" onclick="mark(${j.id},'skip')">Skip</button></div><div><textarea id="post${j.id}">${esc(j.post_text)}</textarea><br><button onclick="copyPost(${j.id})">Copy Full Post</button> <button onclick="copyLinkPreviewPost(${j.id})">Copy Link Preview</button> <button onclick="copyAndOpen(${j.id})">Copy + Open Group</button> <button onclick="postToFacebookPage(${j.id})">Post to Page</button> <button class="light" onclick="refreshPost(${j.id})">Add Hashtags</button> <button class="light" onclick="savePost(${j.id})">Save Edit</button></div></div></div>`).join('');
    }
    function changeProfile(){
      const profile=locationProfiles.find(p=>p.id===$('profile').value);
      if(profile) { document.title=profile.label; $('appTitle').textContent=profile.label; }
      loadSourceStatus();
      loadJobs();
    }
    function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function formatDate(s){ if(!s) return 'unknown'; const d=new Date(s); return Number.isNaN(d.getTime()) ? s : d.toLocaleString(); }
    async function mark(id,status){ await fetch(`/api/jobs/${id}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})}); loadJobs(); }
    async function savePost(id){ await fetch(`/api/jobs/${id}/post`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({post_text:$('post'+id).value})}); $('msg').textContent='Saved.'; }
    async function refreshPost(id){
      const r=await fetch(`/api/jobs/${id}/refresh-post`,{method:'POST',headers:{'Content-Type':'application/json'}});
      const result=await r.json();
      if(result.post_text) $('post'+id).value=result.post_text;
      $('msg').textContent=result.ok?'Hashtags added.':'Could not refresh post.';
    }
    async function copyPost(id){
      await copyText($('post'+id).value);
      $('msg').textContent='Copied in Facebook-safe plain text. Paste directly into Facebook.';
    }
    async function copyText(text){
      const normalized=String(text||'').replace(/\r?\n/g,'\n');
      const ta=document.createElement('textarea');
      ta.value=normalized;
      ta.setAttribute('readonly','');
      ta.style.position='fixed';
      ta.style.left='-9999px';
      ta.style.top='0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0,ta.value.length);
      let copied=false;
      try{ copied=document.execCommand('copy'); }catch(e){}
      ta.remove();
      if(!copied && navigator.clipboard) await navigator.clipboard.writeText(normalized);
    }
    async function copyLinkPreviewPost(id){
      const r=await fetch(`/api/jobs/${id}/link-preview-post`);
      const result=await r.json();
      await copyText(result.post_text||'');
      $('msg').textContent='Copied link-preview post. Paste into Facebook and wait for the card preview.';
    }
    async function getFacebookGroupUrl(){
      const r=await fetch('/api/config');
      if(!r.ok) return 'https://www.facebook.com/groups/jobsinnewjersey';
      const config=await r.json();
      return config.facebookGroupUrl || 'https://www.facebook.com/groups/jobsinnewjersey';
    }
    async function openFacebookGroup(){ window.open(await getFacebookGroupUrl(),'_blank','noopener'); }
    async function copyAndOpen(id){
      await copyPost(id);
      openFacebookGroup();
      $('msg').textContent='Copied. Facebook group opened. Paste the post into the group composer.';
    }
    async function postToFacebookPage(id){
      $('msg').textContent='Posting to Facebook Page...';
      const r=await fetch(`/api/jobs/${id}/facebook-page`,{method:'POST',headers:{'Content-Type':'application/json'}});
      const result=await r.json();
      $('msg').textContent=result.ok?'Posted to Facebook Page.':`Facebook Page post failed: ${result.error||'Unknown error'}`;
      loadJobs();
    }
    async function autoPostToFacebookPage(){
      $('msg').textContent='Posting queued jobs to Facebook Page...';
      const r=await fetch('/api/facebook-page/auto-post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
      const result=await r.json();
      $('msg').textContent=JSON.stringify(result);
      loadJobs();
    }
    function exportCsv(){ location.href='/api/export.csv'; }
    loadSourceStatus();
    loadJobs();
  </script>
</body>
</html>
